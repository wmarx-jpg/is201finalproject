<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Space Pacman: Crown Hunter</title>
    <style>
        body {
            background-color: #050510;
            color: #fff;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        h1 {
            color: #39ff14;
            margin-bottom: 5px;
            letter-spacing: 3px;
            text-shadow: 0 0 15px rgba(57, 255, 20, 0.6);
        }

        #ui-board {
            display: flex;
            gap: 30px;
            font-size: 18px;
            margin-bottom: 15px;
            font-weight: bold;
            background: rgba(255, 255, 255, 0.05);
            padding: 10px 20px;
            border-radius: 20px;
            border: 1px solid #3b3b6d;
        }

        .highlight {
            color: #ffd700; /* Gold */
        }

        #game-container {
            position: relative;
            border: 4px solid #3b3b6d;
            box-shadow: 0 0 30px rgba(59, 59, 109, 0.4);
            border-radius: 8px;
        }

        canvas {
            background-color: #020208;
            display: block;
        }

        .menu {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(5, 5, 16, 0.92);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .hidden {
            display: none !important;
        }

        button {
            background-color: transparent;
            color: #39ff14;
            border: 2px solid #39ff14;
            padding: 12px 24px;
            font-size: 18px;
            font-family: 'Courier New', Courier, monospace;
            cursor: pointer;
            margin-top: 15px;
            font-weight: bold;
            transition: all 0.2s ease;
        }

        button:hover {
            background-color: #39ff14;
            color: #000;
            box-shadow: 0 0 15px #39ff14;
        }
    </style>
</head>
<body>

    <h1>NEON COSMOS SURVIVAL</h1>
    <div id="ui-board">
        <div>Crowns Captured: <span id="crown-count" class="highlight">0</span></div>
        <div>Score: <span id="score">0</span></div>
        <div>Best Run: <span id="high-score">0</span></div>
        <div>Speed: <span id="speed-multiplier">1.0</span>x</div>
    </div>

    <div id="game-container">
        <canvas id="gameCanvas" width="700" height="700"></canvas>
        
        <div id="game-menu" class="menu">
            <h2 id="menu-title" style="color: #39ff14;">ORBITAL VELOCITY</h2>
            <p id="menu-text" style="text-align: center; max-width: 80%; line-height: 1.6; color: #8a8ab0;">
                Capture the floating golden Crown while avoiding obstacles. <br>
                Every second you survive speeds you up. Watch out for the giant Ghost!
            </p>
            <button id="start-btn">LAUNCH</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        
        // UI Elements
        const scoreElement = document.getElementById("score");
        const crownElement = document.getElementById("crown-count");
        const highScoreElement = document.getElementById("high-score");
        const speedElement = document.getElementById("speed-multiplier");
        const menu = document.getElementById("game-menu");
        const menuTitle = document.getElementById("menu-title");
        const menuText = document.getElementById("menu-text");
        const startBtn = document.getElementById("start-btn");

        // Game State Variables
        let pacman, ghost, crown, keys;
        let planets = [];
        let asteroids = [];
        let score, crownsCaptured, baseSpeed, speedMultiplier;
        let sessionHighScore = 0;
        let gameOverFlag, lastTime, speedTimer;
        let mouthAngle, mouthClosing;

        startBtn.addEventListener("click", startGame);
        window.addEventListener("keydown", e => keys[e.code] = true);
        window.addEventListener("keyup", e => keys[e.code] = false);

        function startGame() {
            menu.classList.add("hidden");
            init();
            requestAnimationFrame(gameLoop);
        }

        function init() {
            score = 0;
            crownsCaptured = 0;
            baseSpeed = 3.5;
            speedMultiplier = 1.0;
            gameOverFlag = false;
            keys = {};
            lastTime = performance.now();
            speedTimer = 0;
            mouthAngle = 0.2;
            mouthClosing = 1;

            pacman = {
                x: canvas.width / 2,
                y: canvas.height * 0.8,
                radius: 14,
                angle: 0
            };

            ghost = {
                x: canvas.width / 2,
                y: canvas.height * 0.2,
                radius: 32, 
                speed: 1.5 
            };

            // Setup static planets
            planets = [
                { x: 180, y: 200, radius: 40, color: "#4d94ff" }, 
                { x: 520, y: 250, radius: 55, color: "#ff9933" }, 
                { x: 350, y: 450, radius: 35, color: "#ff5050" }  
            ];

            // Setup drifting asteroids
            asteroids = [];
            for (let i = 0; i < 5; i++) {
                asteroids.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * (canvas.height * 0.4), 
                    radius: 12 + Math.random() * 12,
                    dx: (Math.random() - 0.5) * 2,
                    dy: (Math.random() - 0.5) * 2
                });
            }

            // Spawn the initial moving objective crown
            spawnCrown();

            // Render current UI
            scoreElement.textContent = score;
            crownElement.textContent = crownsCaptured;
            highScoreElement.textContent = sessionHighScore;
            speedElement.textContent = speedMultiplier.toFixed(1);
        }

        function spawnCrown() {
            // Pick random location
            let targetX = 50 + Math.random() * (canvas.width - 100);
            let targetY = 50 + Math.random() * (canvas.height - 100);

            crown = {
                x: targetX,
                y: targetY,
                width: 24,
                height: 18,
                dx: (Math.random() - 0.5) * 1.5, // Slow float velocity
                dy: (Math.random() - 0.5) * 1.5
            };

            // Make sure crown doesn't instantly spawn trapped deep inside a planet
            planets.forEach(planet => {
                let dx = crown.x - planet.x;
                let dy = crown.y - planet.y;
                let dist = Math.sqrt(dx * dx + dy * dy);
                if (dist < planet.radius + 30) {
                    spawnCrown(); // Re-roll positioning recursive loop safety
                }
            });
        }

        function gameLoop(currentTime) {
            if (gameOverFlag) return;

            let deltaTime = (currentTime - lastTime) / 1000;
            if (deltaTime > 0.1) deltaTime = 0.1;
            lastTime = currentTime;

            update(deltaTime);
            draw();

            requestAnimationFrame(gameLoop);
        }

        function update(dt) {
            // Speed scaling over time
            speedTimer += dt;
            if (speedTimer >= 1.0) { 
                speedMultiplier += 0.04; 
                score += 15; // Point ticking for active survival
                scoreElement.textContent = score;
                speedElement.textContent = speedMultiplier.toFixed(2);
                speedTimer = 0;
            }

            let currentPacSpeed = baseSpeed * speedMultiplier;
            let oldX = pacman.x;
            let oldY = pacman.y;

            // Movement Inputs
            if (keys["ArrowLeft"] || keys["KeyA"]) { pacman.x -= currentPacSpeed; pacman.angle = Math.PI; }
            if (keys["ArrowRight"] || keys["KeyD"]) { pacman.x += currentPacSpeed; pacman.angle = 0; }
            if (keys["ArrowUp"] || keys["KeyW"]) { pacman.y -= currentPacSpeed; pacman.angle = Math.PI * 1.5; }
            if (keys["ArrowDown"] || keys["KeyS"]) { pacman.y += currentPacSpeed; pacman.angle = Math.PI * 0.5; }

            // Boundaries
            pacman.x = Math.max(pacman.radius, Math.min(canvas.width - pacman.radius, pacman.x));
            pacman.y = Math.max(pacman.radius, Math.min(canvas.height - pacman.radius, pacman.y));

            // Planet Collisions
            planets.forEach(planet => {
                let dx = pacman.x - planet.x;
                let dy = pacman.y - planet.y;
                let dist = Math.sqrt(dx * dx + dy * dy);
                if (dist < pacman.radius + planet.radius) {
                    pacman.x = oldX;
                    pacman.y = oldY;
                }
            });

            // Crown Movement Update & Walls Collision
            crown.x += crown.dx;
            crown.y += crown.dy;
            if (crown.x < 10 || crown.x > canvas.width - 20) crown.dx *= -1;
            if (crown.y < 10 || crown.y > canvas.height - 20) crown.dy *= -1;

            // Check if Pacman touched the Crown
            let cx = pacman.x - crown.x;
            let cy = pacman.y - crown.y;
            let crownDist = Math.sqrt(cx * cx + cy * cy);
            if (crownDist < pacman.radius + 12) {
                crownsCaptured += 1;
                score += 250; // Big bonus points for gathering objectives
                crownElement.textContent = crownsCaptured;
                scoreElement.textContent = score;
                spawnCrown(); // Instant reset target cyclically 
            }

            // Mouth Animation
            mouthAngle += 0.02 * mouthClosing;
            if (mouthAngle > 0.4 || mouthAngle < 0.05) mouthClosing *= -1;

            // Asteroid Physics & Collision
            asteroids.forEach(ast => {
                ast.x += ast.dx;
                ast.y += ast.dy;
                if (ast.x < 0 || ast.x > canvas.width) ast.dx *= -1;
                if (ast.y < 0 || ast.y > canvas.height) ast.dy *= -1;

                let ax = pacman.x - ast.x;
                let ay = pacman.y - ast.y;
                let aDist = Math.sqrt(ax * ax + ay * ay);
                if (aDist < pacman.radius + ast.radius - 2) endGame();
            });

            // Giant Ghost Movement Tracking
            let gdx = pacman.x - ghost.x;
            let gdy = pacman.y - ghost.y;
            let gDist = Math.sqrt(gdx * gdx + gdy * gdy);
            if (gDist > 0) {
                ghost.x += (gdx / gDist) * ghost.speed;
                ghost.y += (gdy / gDist) * ghost.speed;
            }

            if (gDist < pacman.radius + ghost.radius - 6) endGame();
        }

        function drawCrown(x, y, w, h) {
            ctx.fillStyle = "#ffd700"; // Metallic Gold
            ctx.strokeStyle = "#ffa500";
            ctx.lineWidth = 2;
            
            ctx.beginPath();
            // Start bottom left corner of base
            ctx.moveTo(x - w/2, y + h/2);
            // Peak 1 (Left spike)
            ctx.lineTo(x - w/2, y - h/2);
            // Valley 1
            ctx.lineTo(x - w/4, y + h/6);
            // Peak 2 (Center spike)
            ctx.lineTo(x, y - h/2);
            // Valley 2
            ctx.lineTo(x + w/4, y + h/6);
            // Peak 3 (Right spike)
            ctx.lineTo(x + w/2, y - h/2);
            // Bottom Right corner
            ctx.lineTo(x + w/2, y + h/2);
            ctx.closePath();
            ctx.fill();
            ctx.stroke();

            // Little colored royal gems details on peaks
            ctx.fillStyle = "#ff0055";
            ctx.beginPath();
            ctx.arc(x - w/2, y - h/2, 2, 0, Math.PI * 2);
            ctx.arc(x, y - h/2, 2, 0, Math.PI * 2);
            ctx.arc(x + w/2, y - h/2, 2, 0, Math.PI * 2);
            ctx.fill();
        }

        function draw() {
            ctx.fillStyle = "#020208";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Background Starfield
            ctx.fillStyle = "rgba(255, 255, 255, 0.3)";
            for (let i = 0; i < 30; i++) {
                let x = (Math.sin(i) * 0.5 + 0.5) * canvas.width;
                let y = (Math.cos(i * 2) * 0.5 + 0.5) * canvas.height;
                ctx.fillRect(x, y, 2, 2);
            }

            // Stationary Planets
            planets.forEach(planet => {
                ctx.fillStyle = planet.color;
                ctx.beginPath();
                ctx.arc(planet.x, planet.y, planet.radius, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = "rgba(0, 0, 0, 0.25)";
                ctx.beginPath();
                ctx.arc(planet.x + 5, planet.y + 5, planet.radius, 0, Math.PI * 2);
                ctx.fill();
            });

            // Drifting Asteroids
            ctx.fillStyle = "#7a6b58";
            asteroids.forEach(ast => {
                ctx.beginPath();
                ctx.arc(ast.x, ast.y, ast.radius, 0, Math.PI * 2);
                ctx.fill();
            });

            // Render the floating Objective Crown
            drawCrown(crown.x, crown.y, crown.width, crown.height);

            // Green Pacman
            ctx.fillStyle = "#39ff14"; 
            ctx.beginPath();
            ctx.arc(
                pacman.x, pacman.y, pacman.radius, 
                pacman.angle + mouthAngle, 
                pacman.angle + (Math.PI * 2) - mouthAngle
            );
            ctx.lineTo(pacman.x, pacman.y);
            ctx.fill();

            // Ghost Behemoth
            ctx.fillStyle = "#ff2a2a"; 
            ctx.beginPath();
            ctx.arc(ghost.x, ghost.y, ghost.radius, Math.PI, 0, false);
            ctx.lineTo(ghost.x + ghost.radius, ghost.y + ghost.radius);
            ctx.lineTo(ghost.x + ghost.radius * 0.5, ghost.y + ghost.radius - 8);
            ctx.lineTo(ghost.x, ghost.y + ghost.radius);
            ctx.lineTo(ghost.x - ghost.radius * 0.5, ghost.y + ghost.radius - 8);
            ctx.lineTo(ghost.x - ghost.radius, ghost.y + ghost.radius);
            ctx.closePath();
            ctx.fill();

            // Ghost Eyes
            ctx.fillStyle = "#fff";
            ctx.beginPath();
            ctx.arc(ghost.x - 10, ghost.y - 4, 8, 0, Math.PI * 2);
            ctx.arc(ghost.x + 10, ghost.y - 4, 8, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = "#0000ff";
            ctx.beginPath();
            ctx.arc(ghost.x - 8, ghost.y - 4, 4, 0, Math.PI * 2);
            ctx.arc(ghost.x + 12, ghost.y - 4, 4, 0, Math.PI * 2);
            ctx.fill();
        }

        function endGame() {
            gameOverFlag = true;
            
            // Handle High Score tracking calculations
            if (score > sessionHighScore) {
                sessionHighScore = score;
            }

            menuTitle.textContent = "MISSION FAILURE";
            menuText.innerHTML = `
                You collected <span class="highlight">${crownsCaptured}</span> crowns this round.<br>
                Total Score earned: <strong>${score}</strong> points.
            `;
            startBtn.textContent = "RETRY ROUND";
            menu.classList.remove("hidden");
        }
    </script>
</body>
</html>
